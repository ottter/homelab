---
# Traefik — ingress controller, holds the first MetalLB IP.
#
# Pinned to 35.2.0 to match the running release. Values mirror what the Ansible
# networking role passed via --set, so Flux adopts without changing anything.
#
# k3s ships its own Traefik; it is disabled via --disable traefik in
# ansible/roles/k3s/defaults/main.yml so this is the only one.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 24h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "${traefik_version}"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
  values:
    globalArguments:
      - "--global.sendAnonymousUsage=false"
    service:
      type: LoadBalancer
      annotations:
        metallb.universe.tf/loadBalancerIPs: "${traefik_lb_ip}"
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
      websecure:
        tls:
          enabled: true
