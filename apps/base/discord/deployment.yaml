---
# Disabled by default: DISCORD_TOKEN is empty. To enable, set it in
# apps/base/discord/secret.enc.yaml, create the GHCR pull secret (see below),
# then list this app in apps/mini/kustomization.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: discord
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord
  namespace: discord
  labels:
    app: discord
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: discord
  template:
    metadata:
      labels:
        app: discord
    spec:
      containers:
        - name: discord
          image: "${discord_image}"
          imagePullPolicy: IfNotPresent
          env:
            - name: DISCORD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: discord-secrets
                  key: DISCORD_TOKEN
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: discord-data
      imagePullSecrets:
        - name: discord-ghcr
