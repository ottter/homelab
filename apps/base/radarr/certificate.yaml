---
# Signed by the homelab CA (infrastructure/configs/cluster-issuer.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: radarr-tls
  namespace: radarr
spec:
  secretName: radarr-tls
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "radarr.${domain_root}"
