---
# https://truecharts.org/charts/stable/radarr/
# Ported from terraform/modules/radarr.
#
# The API key is PINNED via RADARR__AUTH__APIKEY from the SOPS secret.
# Terraform instead scraped the generated key out of the running pod and fed it
# to Homepage; Flux cannot read live cluster state, so the key is now declared.
apiVersion: v1
kind: Namespace
metadata:
  name: radarr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
  namespace: radarr
spec:
  interval: 1h
  chart:
    spec:
      chart: radarr
      version: "${radarr_version}"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      timezone: "${timezone}"

    # NFS media mount is OFF by default (nfs_enabled was false in tfvars and no
    # exports exist on the node). Enable it per-cluster once the drive is
    # attached and the Ansible nfs role has run.
    persistence:
      media:
        enabled: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                RADARR__APP__THEME: dark
              envFrom:
                - secretRef:
                    name: radarr-secrets
                    # Secret is created by Flux from SOPS, not by the chart.
                    # Without this TrueCharts looks for it in its own values
                    # and fails with "Expected Secret ... to exist".
                    expandObjectName: false

    metrics:
      main:
        enabled: false

    ingress:
      main:
        ingressClassName: traefik
        enabled: true
        integrations:
          homepage:
            enabled: true
          traefik:
            enabled: true
        hosts:
          - host: "radarr.${domain_root}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "radarr.${domain_root}"
            secretName: radarr-tls
