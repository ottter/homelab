---
# https://truecharts.org/charts/stable/homepage/
#
# Config lives in configmap.yaml; API keys come from the SOPS secret as
# HOMEPAGE_VAR_* env vars, which Homepage substitutes into that config at
# runtime ({{HOMEPAGE_VAR_NAME}}). No key is ever written to git in clear.
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "${homepage_version}"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      timezone: "${timezone}"

    workload:
      main:
        podSpec:
          containers:
            main:
              envFrom:
                - secretRef:
                    name: homepage-secrets
                    # Secret is created by Flux from SOPS, not by the chart.
                    # Without this TrueCharts looks for it in its own values
                    # and fails with "Expected Secret ... to exist".
                    expandObjectName: false
              env:
                HOMEPAGE_ALLOWED_HOSTS: "homepage.${domain_root}"

    ingress:
      main:
        ingressClassName: traefik
        enabled: true
        integrations:
          traefik:
            enabled: true
        hosts:
          - host: "homepage.${domain_root}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "homepage.${domain_root}"
            secretName: homepage-tls
