---
# https://truecharts.org/charts/stable/homepage/
# Ported from terraform/modules/homepage.
#
# Terraform built the config files with templatefile() and injected API keys it
# had scraped from other modules' outputs. Here the config is a ConfigMap and
# the keys come from the SOPS secret as HOMEPAGE_VAR_* env vars, which Homepage
# substitutes into its own config at runtime ({{HOMEPAGE_VAR_NAME}}).
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 1h
  chart:
    spec:
      chart: homepage
      version: "13.6.0"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      timezone: "${timezone}"

    workload:
      main:
        podSpec:
          containers:
            main:
              envFrom:
                - secretRef:
                    name: homepage-secrets
              env:
                HOMEPAGE_ALLOWED_HOSTS: "homepage.${domain_root}"

    ingress:
      main:
        ingressClassName: traefik
        enabled: true
        integrations:
          traefik:
            enabled: true
        hosts:
          - host: "homepage.${domain_root}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "homepage.${domain_root}"
            secretName: homepage-tls
