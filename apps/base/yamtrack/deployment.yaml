---
# SECRET is a fixed SOPS-encrypted value rather than a generated one, so user
# sessions survive a redeploy.
apiVersion: v1
kind: Namespace
metadata:
  name: yamtrack
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yamtrack
  namespace: yamtrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yamtrack
  template:
    metadata:
      labels:
        app: yamtrack
    spec:
      # No pod-level runAsUser: the yamtrack image's entrypoint runs groupmod
      # to remap its own user, which needs root and a writable /etc/group.
      # Forcing UID 1000 here makes it CrashLoopBackOff. It drops privileges
      # itself after startup.
      containers:
        - name: yamtrack
          image: ghcr.io/fuzzygrim/yamtrack:${yamtrack_image_tag}
          ports:
            - containerPort: 8000
          env:
            - name: SECRET
              valueFrom:
                secretKeyRef:
                  name: yamtrack-secrets
                  key: SECRET
            - name: REDIS_URL
              value: redis://localhost:6379
            - name: TZ
              value: "${timezone}"
            - name: URLS
              value: "https://yam.${domain_root}"
          volumeMounts:
            - name: yamtrack-db
              mountPath: /yamtrack/db
          resources:
            requests: {cpu: 20m, memory: 256Mi}
            limits: {cpu: 1000m, memory: 1Gi}
        # redis has no such entrypoint, so it keeps the hardening.
        - name: redis
          image: redis:${redis_image_tag}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            runAsUser: 999
            runAsGroup: 999
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: yamtrack-db
          hostPath:
            path: "${yamtrack_path_db}"
---
apiVersion: v1
kind: Service
metadata:
  name: yamtrack-service
  namespace: yamtrack
spec:
  type: ClusterIP
  selector:
    app: yamtrack
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: yamtrack-ingress
  namespace: yamtrack
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "yam.${domain_root}"
      secretName: yamtrack-tls
  rules:
    - host: "yam.${domain_root}"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: yamtrack-service
                port:
                  number: 8000
