---
# Signed by the homelab CA (infrastructure/configs/cluster-issuer.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: yamtrack-tls
  namespace: yamtrack
spec:
  secretName: yamtrack-tls
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "yam.${domain_root}"
