---
# Signed by the homelab CA (infrastructure/configs/cluster-issuer.yaml).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sonarr-tls
  namespace: sonarr
spec:
  secretName: sonarr-tls
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "sonarr.${domain_root}"
