---
# https://truecharts.org/charts/stable/sonarr/
#
# The API key is pinned via SONARR__AUTH__APIKEY from the SOPS secret rather
# than using the one the app generates on first run, so Homepage can be
# configured with the same value from git.
apiVersion: v1
kind: Namespace
metadata:
  name: sonarr
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sonarr
  namespace: sonarr
spec:
  interval: 1h
  chart:
    spec:
      chart: sonarr
      version: "${sonarr_version}"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      timezone: "${timezone}"

    # NFS media mount is OFF by default (nfs_enabled was false in tfvars and no
    # exports exist on the node). Enable it per-cluster once the drive is
    # attached and the Ansible nfs role has run.
    persistence:
      media:
        enabled: false

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                SONARR__APP__THEME: dark
              envFrom:
                - secretRef:
                    name: sonarr-secrets
                    # Secret is created by Flux from SOPS, not by the chart.
                    # Without this TrueCharts looks for it in its own values
                    # and fails with "Expected Secret ... to exist".
                    expandObjectName: false

    metrics:
      main:
        enabled: false

    ingress:
      main:
        ingressClassName: traefik
        enabled: true
        integrations:
          homepage:
            enabled: true
          traefik:
            enabled: true
        hosts:
          - host: "sonarr.${domain_root}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "sonarr.${domain_root}"
            secretName: sonarr-tls
