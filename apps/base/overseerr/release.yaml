---
# https://truecharts.org/charts/stable/overseerr/
#
# Chart version comes from cluster-vars.yaml, substituted by Flux.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overseerr
  namespace: overseerr
spec:
  interval: 1h
  chart:
    spec:
      chart: overseerr
      version: "${overseerr_version}"
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    global:
      stopAll: false
      timezone: "${timezone}"

    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                LOG_LEVEL: warn

    metrics:
      main:
        enabled: false

    ingress:
      main:
        ingressClassName: traefik
        enabled: true
        integrations:
          homepage:
            enabled: false
          traefik:
            enabled: true
        hosts:
          - host: "overseerr.${domain_root}"
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - "overseerr.${domain_root}"
            secretName: overseerr-tls
