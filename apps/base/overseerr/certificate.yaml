---
# Signed by the homelab CA (infrastructure/configs/cluster-issuer.yaml).
#
# The cert-manager CRDs this depends on are applied by the infra-controllers
# Kustomization, which infra-configs and apps both wait on.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: overseerr-tls
  namespace: overseerr
spec:
  secretName: overseerr-tls
  issuerRef:
    name: homelab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "overseerr.${domain_root}"
