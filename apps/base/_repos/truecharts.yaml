---
# TrueCharts OCI registry — shared by every TrueCharts app.
# Lives in apps/base (not per-app) so there is one definition to update.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: truecharts
  namespace: flux-system
spec:
  type: oci
  interval: 24h
  url: oci://oci.trueforge.org/truecharts
