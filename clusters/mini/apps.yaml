---
# Workloads. Waits for infrastructure so ClusterIssuer and IngressClass exist
# before any app Certificate or Ingress is applied.
#
# decryption is what lets apps carry SOPS-encrypted Secrets: Flux decrypts
# *.enc.yaml in-cluster using the age key Ansible loaded as 'sops-age'.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-configs
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/mini
  prune: true
  wait: false
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-vars
