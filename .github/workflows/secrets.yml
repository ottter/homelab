name: Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed in a later commit is still
          # retrievable from the earlier one, so scanning only the tip
          # would miss exactly the case that matters.
          fetch-depth: 0

      - name: Scan for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified --fail
