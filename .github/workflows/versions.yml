name: Version consistency

# versions.yaml is the single source of truth, but Flux manifests cannot read a
# file — their versions are literals. This fails the build if the two drift.

on:
  push:
    branches: ["main"]
    paths: ["versions.yaml", "infrastructure/**", "apps/**"]
  pull_request:
    branches: ["main"]
    paths: ["versions.yaml", "infrastructure/**", "apps/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare versions.yaml against HelmRelease pins
        run: |
          python3 - <<'PY'
          import re, sys, pathlib, yaml

          versions = yaml.safe_load(open("versions.yaml"))

          # version key in versions.yaml -> HelmRelease manifest it must match
          checks = {
              "metallb_version":     "infrastructure/controllers/metallb.yaml",
              "traefik_version":     "infrastructure/controllers/traefik.yaml",
              "certmanager_version": "infrastructure/controllers/cert-manager.yaml",
          }

          failed = False
          for key, path in checks.items():
              expected = versions.get(key)
              p = pathlib.Path(path)
              if not p.exists():
                  print(f"SKIP  {path} (not present)")
                  continue
              # the chart version line inside spec.chart.spec
              m = re.search(r'^\s+version:\s*"?([^"\s]+)"?', p.read_text(), re.M)
              actual = m.group(1) if m else None
              if actual != expected:
                  print(f"FAIL  {path}: pinned {actual!r} but versions.yaml says {expected!r}")
                  failed = True
              else:
                  print(f"OK    {path}: {actual}")

          sys.exit(1 if failed else 0)
          PY
