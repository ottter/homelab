---
# Ansible-only settings. Anything shared with the cluster — IPs, domain,
# timezone, storage paths — lives in clusters/mini/cluster-vars.yaml and is
# mapped onto these variable names in playbook_bootstrap.yml.
#
# Chart and image versions live there too, substituted by Flux.

# System
hostname: "minipc"

# SSH hardening
hardening_ssh_port: 22
hardening_ssh_allowed_users: ["{{ ansible_user }}"]
hardening_ssh_password_auth: "no"
hardening_ssh_permit_root_login: "no"
hardening_ssh_max_auth_tries: 3
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count_max: 2

# fail2ban
hardening_fail2ban_maxretry: 5
hardening_fail2ban_bantime: 3600
hardening_fail2ban_findtime: 600

# k3s — changing the version reinstalls in place (preserves /var/lib/rancher/k3s).
k3s_version: "v1.35.3+k3s1"
k3s_force_reinstall: false

# NFS — set nfs_enabled: true once the external drive is attached.
# nfs_mount_point comes from cluster-vars.
nfs_enabled: false
nfs_device: "/dev/sdb1"
nfs_owner_uid: 1000

# Backups — nightly on-node config snapshot to /var/backups/homelab.
# App config only; cluster state is rebuilt from git by Flux. See docs/backups.md.
backup_enabled: true
backup_retention: 7
backup_on_calendar: "03:30"
