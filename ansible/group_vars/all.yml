---
# Network
lan_subnet: "192.168.0.0/24"
server_lan_ip: "192.168.0.210"
# These two feed dnsmasq only. The MetalLB pool itself is owned by Flux
# (infrastructure/configs/metallb-pool.yaml) — keep these in sync with it.
networking_traefik_lb_ip: "192.168.0.220"  # must match traefik_lb_ip in clusters/mini/cluster-vars.yaml
plex_lb_ip: "192.168.0.221"  # must match plex_lb_ip in clusters/mini/cluster-vars.yaml
domain_suffix: "local"  # Must match domain_root in clusters/mini/cluster-vars.yaml

# System
hostname: "minipc"
timezone: "America/New_York"

# SSH hardening
hardening_ssh_port: 22
hardening_ssh_allowed_users: ["{{ ansible_user }}"]
hardening_ssh_password_auth: "no"
hardening_ssh_permit_root_login: "no"
hardening_ssh_max_auth_tries: 3
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count_max: 2

# fail2ban
hardening_fail2ban_maxretry: 5
hardening_fail2ban_bantime: 3600
hardening_fail2ban_findtime: 600

# k3s — version comes from ../versions.yaml (loaded by playbook vars_files)
k3s_force_reinstall: false

# NFS (disabled until external drive is attached — set nfs_enabled: true to activate)
nfs_enabled: false
nfs_device: "/dev/sdb1"
nfs_mount_point: "/mnt/plex"
nfs_owner_uid: 1000
