---
# Idempotent — safe to re-run at any time.
# Provisions the full minipc: OS hardening, k3s cluster, and optional NFS storage.
#
# Usage:
#   set -a && . .env && set +a
#   ansible-playbook playbook_bootstrap.yml
#
# After first run, test with:
#   KUBECONFIG=ansible/kubeconfig kubectl get nodes
#   KUBECONFIG=ansible/kubeconfig flux get kustomizations

- name: Provision minipc
  hosts: minipc
  become: true

  # cluster-vars is the single source of truth shared with Flux: IPs, domain,
  # timezone, storage paths and versions. It is a ConfigMap Flux substitutes
  # from; loaded here it exposes those keys as data.<key>.
  vars_files:
    - ../clusters/mini/cluster-vars.yaml

  # Map the ConfigMap keys onto the names the roles already use, so there is
  # exactly one place to change an IP or a path.
  vars:
    server_lan_ip: "{{ data.server_ip }}"
    lan_subnet: "{{ data.lan_subnet }}"
    domain_suffix: "{{ data.domain_root }}"
    timezone: "{{ data.timezone }}"
    networking_traefik_lb_ip: "{{ data.traefik_lb_ip }}"
    plex_lb_ip: "{{ data.plex_lb_ip }}"
    nfs_mount_point: "{{ data.nfs_mount_point }}"

  roles:
    - common
    - hardening
    - k3s
    - networking
    - nfs
    - dnsmasq
    - flux
