---
# MetalLB, Traefik, cert-manager, the IPAddressPool, the ClusterIssuer chain and
# the Traefik middleware are all reconciled by Flux — see infrastructure/.
#
# Flux is the single owner. To hand control back to Ansible, suspend the Flux
# Kustomizations first:
#   flux suspend kustomization infra-controllers infra-configs
#
# The CA export lives in roles/flux, because on a fresh build the CA secret does
# not exist until Flux has reconciled cert-manager.
#
# Helm is installed here only as an operator convenience for poking at releases
# by hand (helm list, helm get values). Flux's helm-controller runs in-cluster
# and does not use it. Set networking_install_helm: false to skip.

- name: Helm CLI (operator convenience only — not used by Flux)
  when: networking_install_helm
  block:
    - name: Check if Helm is installed
      ansible.builtin.command: helm version --short
      register: networking_helm_check
      changed_when: false
      failed_when: false

    # The official script verifies the binary with a sha256 checksum.
    - name: Download Helm install script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: "0700"
      when: networking_helm_check.rc != 0

    - name: Install Helm
      ansible.builtin.command: /tmp/get-helm-3.sh
      when: networking_helm_check.rc != 0
      changed_when: true
