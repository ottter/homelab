---
k3s_install_url: "https://get.k3s.io"
# k3s_version intentionally not defaulted here — it comes from versions.yaml so
# there is one source of truth. The playbook loads it via vars_files.
k3s_force_reinstall: false
k3s_extra_args: >-
  --disable traefik
  --disable servicelb
  --write-kubeconfig-mode 600
  --secrets-encryption
  --kube-apiserver-arg=admission-control-config-file=/etc/rancher/k3s/psa.yaml
