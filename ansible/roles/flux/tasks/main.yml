---
# Installs Flux into the cluster and gives it the age key for SOPS decryption.
#
# Runs from the control machine (your PC), not the server — uses the local flux
# CLI and kubeconfig. Nothing is installed on the minipc.
#
# Idempotent: `flux bootstrap` reconciles to the desired state, so re-running
# the playbook is safe.

- name: Flux GitOps setup
  when: flux_enabled
  delegate_to: localhost
  become: false
  block:
    - name: Check flux CLI is installed
      ansible.builtin.command: flux --version
      register: flux_cli
      changed_when: false
      failed_when: false

    - name: Fail if flux CLI is missing
      ansible.builtin.assert:
        that: flux_cli.rc == 0
        fail_msg: >-
          flux CLI not found. Install it:
          curl -s https://fluxcd.io/install.sh | sudo bash

    - name: Fail if GITHUB_TOKEN is not set
      ansible.builtin.assert:
        that: flux_github_token | length > 0
        fail_msg: >-
          GITHUB_TOKEN is not set. Add it to ansible/.env (needs 'repo' scope),
          then: set -a && . .env && set +a

    - name: Check age key exists on control machine
      ansible.builtin.stat:
        path: "{{ flux_age_key_file | expanduser }}"
      register: flux_age_key

    - name: Fail if age key is missing
      ansible.builtin.assert:
        that: flux_age_key.stat.exists
        fail_msg: >-
          age key not found at {{ flux_age_key_file }}.
          Generate it: age-keygen -o ~/.config/sops/age/keys.txt

    # Bootstrap installs the controllers, commits clusters/<name>/flux-system
    # to the repo, and starts reconciling. Additive — existing workloads
    # (MetalLB, Traefik, cert-manager) are untouched.
    - name: Bootstrap Flux against the cluster
      ansible.builtin.command:
        cmd: >-
          flux bootstrap github
          --owner={{ flux_github_owner }}
          --repository={{ flux_github_repo }}
          --branch={{ flux_github_branch }}
          --path={{ flux_cluster_path }}
          --personal
      environment:
        GITHUB_TOKEN: "{{ flux_github_token }}"
        KUBECONFIG: "{{ flux_kubeconfig }}"
      register: flux_bootstrap
      changed_when: "'components are up to date' not in flux_bootstrap.stdout"

    # Flux needs the private key in-cluster to decrypt *.enc.yaml on apply.
    # Applied after bootstrap so the flux-system namespace exists.
    - name: Create sops-age secret for Flux decryption
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl create secret generic sops-age \
            --namespace=flux-system \
            --from-file=age.agekey={{ flux_age_key_file | expanduser }} \
            --dry-run=client -o yaml | kubectl apply -f -
        executable: /bin/bash
      environment:
        KUBECONFIG: "{{ flux_kubeconfig }}"
      register: flux_sops_secret
      changed_when: "'configured' in flux_sops_secret.stdout or 'created' in flux_sops_secret.stdout"

    - name: Wait for Flux controllers to be ready
      ansible.builtin.command:
        cmd: flux check
      environment:
        KUBECONFIG: "{{ flux_kubeconfig }}"
      register: flux_health
      retries: 10
      delay: 10
      until: flux_health.rc == 0
      changed_when: false

# CA export — moved here from the networking role.
#
# Flux mints the homelab CA but cannot write files to the server or fetch them
# back to your PC. On a fresh build the secret does not exist until Flux has
# reconciled cert-manager, so this must run after the Kustomizations are ready.
- name: Export homelab CA for browser trust
  when: flux_enabled
  block:
    # The flux CLI has no 'wait' subcommand; wait on the Ready condition.
    - name: Wait for infrastructure Kustomizations to be ready
      ansible.builtin.command:
        cmd: >-
          kubectl wait kustomization/infra-configs
          --namespace flux-system
          --for=condition=Ready
          --timeout=5m
      environment:
        KUBECONFIG: "{{ flux_kubeconfig }}"
      delegate_to: localhost
      become: false
      changed_when: false

    # The '.' in tls.crt must be escaped AND the jsonpath quoted — otherwise
    # kubectl reads it as a path separator, finds nothing, and returns an empty
    # string, which silently produced a 0-byte CA file.
    - name: Read homelab CA certificate from cluster
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl get secret homelab-ca-secret -n cert-manager \
            -o 'jsonpath={.data.tls\.crt}' | base64 -d
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      register: flux_ca_cert
      changed_when: false

    - name: Verify the CA certificate is not empty
      ansible.builtin.assert:
        that:
          - flux_ca_cert.stdout | length > 0
          - "'BEGIN CERTIFICATE' in flux_ca_cert.stdout"
        fail_msg: >-
          Extracted CA certificate is empty or malformed — check the jsonpath
          and that homelab-ca-secret exists in the cert-manager namespace.

    - name: Write CA cert to /etc/homelab-ca.crt
      ansible.builtin.copy:
        content: "{{ flux_ca_cert.stdout }}\n"
        dest: /etc/homelab-ca.crt
        owner: root
        group: root
        mode: "0644"

    - name: Copy CA cert to local working directory
      ansible.builtin.fetch:
        src: /etc/homelab-ca.crt
        dest: "{{ playbook_dir }}/../homelab-ca.crt"
        flat: true
